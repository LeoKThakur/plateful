<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plateful</title>
  <meta name="description" content="A private calorie and nutrition tracker that keeps its data on your phone.">
  <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plateful">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <main id="main" tabindex="-1"></main>

  <nav id="tabbar" aria-label="Sections">
    <button type="button" data-tab="diary" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
      <span>Diary</span>
    </button>
    <button type="button" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16V11M11 16V6.5M15.5 16v-6M20 16V8.5"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" data-tab="add" class="tab-add" aria-label="Log food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" data-tab="foods">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5v7a2.5 2.5 0 0 0 5 0v-7M9.5 3.5V21M17 21V3.5c-1.9 0-3 2.4-3 5.5s1 4.5 3 4.5"/></svg>
      <span>My Foods</span>
    </button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1-3.8 4-5.8 7.5-5.8s6.5 2 7.5 5.8"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Plateful needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
